<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#060e1a"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="finGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.1"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <!-- Animations -->
    <style>
      @keyframes pulseHub {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5)); opacity: 0.9; }
        50% { filter: drop-shadow(0 0 22px rgba(16, 185, 129, 0.8)); opacity: 1; }
      }
      @keyframes flowStroke {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes sweepScan {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.7; }
        100% { transform: translateY(240px); opacity: 0.2; }
      }
      @keyframes beaconExpand {
        0% { r: 15px; opacity: 0.8; stroke-width: 2px; }
        100% { r: 60px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      .pulse-hub { animation: pulseHub 4s infinite ease-in-out; }
      .stream-line { stroke-dasharray: 12, 12; animation: flowStroke 6s infinite linear; }
      .fast-stream { stroke-dasharray: 8, 8; animation: flowStroke 3.5s infinite linear; }
      .scanner-beam { animation: sweepScan 6s infinite linear; }
      .pulse-beacon { animation: beaconExpand 3s infinite cubic-bezier(0.1, 0.8, 0.3, 1); }
      .float-badge-1 { animation: floatCard1 4s infinite ease-in-out; }
      .float-badge-2 { animation: floatCard2 5s infinite ease-in-out 1s; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; letter-spacing: 0.5px; }
      .text-subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
      .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="900" height="240" fill="url(#bgGrad)" rx="16"/>
  <rect width="900" height="240" fill="url(#finGrid)" rx="16"/>

  <!-- Scanning Line -->
  <rect class="scanner-beam" x="0" y="0" width="900" height="2" fill="url(#flowGrad)" opacity="0.6"/>

  <!-- Background Circuit & Financial Stream Lines -->
  <g opacity="0.45">
    <path class="stream-line" d="M 120 120 L 210 120 L 250 65 L 380 65" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path class="stream-line" d="M 120 120 L 190 175 L 340 175" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <path class="fast-stream" d="M 760 60 L 690 60 L 660 100 L 590 100" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <path class="fast-stream" d="M 820 180 L 730 180 L 700 145 L 630 145" fill="none" stroke="#818cf8" stroke-width="1.2"/>
  </g>

  <!-- Left Side: Core Financial Engine Hub & Vault Motif -->
  <g transform="translate(15, 0)">
    <!-- Expanding Beacon Waves -->
    <circle class="pulse-beacon" cx="105" cy="120" r="20" fill="none" stroke="#38bdf8"/>
    <circle cx="105" cy="120" r="75" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,4"/>
    <circle cx="105" cy="120" r="54" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Vault / Bank Pillar Icon Backdrop -->
    <g class="pulse-hub" transform="translate(65, 80)">
      <rect width="80" height="80" rx="20" fill="#0c1e38" stroke="url(#emeraldGrad)" stroke-width="2.5" filter="url(#glow)"/>
      
      <!-- Bank / Architectural Pediment & Pillars -->
      <!-- Roof / Pediment -->
      <polygon points="40,20 18,32 62,32" fill="url(#titleGrad)"/>
      <rect x="18" y="32" width="44" height="3" rx="1.5" fill="#38bdf8"/>
      <!-- Pillars -->
      <rect x="22" y="37" width="5" height="18" rx="1.5" fill="#e2e8f0"/>
      <rect x="31" y="37" width="5" height="18" rx="1.5" fill="#e2e8f0"/>
      <rect x="44" y="37" width="5" height="18" rx="1.5" fill="#e2e8f0"/>
      <rect x="53" y="37" width="5" height="18" rx="1.5" fill="#e2e8f0"/>
      <!-- Base -->
      <rect x="18" y="57" width="44" height="4" rx="1.5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Right Floating Metric Badges -->
  <g class="float-badge-1" transform="translate(730, 48)">
    <rect width="138" height="44" rx="10" fill="#0d213f" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="22" r="5" fill="#10b981"/>
    <text x="32" y="19" fill="#94a3b8" font-size="9" font-weight="700" class="text-mono">CORE LEDGER</text>
    <text x="32" y="33" fill="#38bdf8" font-size="11" font-weight="800" class="text-mono">99.999% SLA</text>
  </g>

  <g class="float-badge-2" transform="translate(710, 142)">
    <rect width="158" height="44" rx="10" fill="#0d213f" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="22" r="5" fill="#38bdf8"/>
    <text x="32" y="19" fill="#94a3b8" font-size="9" font-weight="700" class="text-mono">OPEN BANKING</text>
    <text x="32" y="33" fill="#34d399" font-size="11" font-weight="800" class="text-mono">ISO 20022 / 1033</text>
  </g>

  <!-- Foreground Title and Content (Highest Layer - Never Obscured) -->
  <g transform="translate(195, 0)">
    <!-- Top Category Badge -->
    <rect x="0" y="38" width="220" height="22" rx="11" fill="#0f2b48" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="12" y="53" fill="#38bdf8" font-size="10.5" font-weight="700" class="text-mono">⚡ FINTECH &amp; DIGITAL BANKING</text>

    <!-- Main Title -->
    <text class="text-title" x="0" y="98" font-size="29" fill="url(#titleGrad)" filter="url(#glow)">
      Awesome Financial Services
    </text>
    <text class="text-title" x="0" y="132" font-size="28" fill="#ffffff">
      Experience Platform
    </text>

    <!-- Subtitle -->
    <text class="text-subtitle" x="0" y="166" font-size="13" fill="#94a3b8">
      Curated ecosystem of Core Banking Engines, Digital Frontends &amp; Open Banking APIs
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 184)">
      <rect x="0" y="0" width="132" height="24" rx="6" fill="#132742" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="10" y="16" fill="#7dd3fc" font-size="11" font-weight="600" class="text-mono">🏛️ Core Banking</text>

      <rect x="142" y="0" width="138" height="24" rx="6" fill="#132742" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
      <text x="152" y="16" fill="#6ee7b7" font-size="11" font-weight="600" class="text-mono">📱 Digital Portals</text>

      <rect x="290" y="0" width="132" height="24" rx="6" fill="#132742" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3"/>
      <text x="300" y="16" fill="#c084fc" font-size="11" font-weight="600" class="text-mono">💳 BaaS &amp; Ledgers</text>
    </g>
  </g>
</svg>
