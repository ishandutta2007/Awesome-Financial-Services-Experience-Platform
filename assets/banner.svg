<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 240"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#050b14"/><stop offset="50%" stop-color="#0b1528"/><stop offset="100%" stop-color="#060e1a"/></linearGradient><linearGradient id="emeraldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="50%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#34d399"/></linearGradient><linearGradient id="goldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient><linearGradient id="flowGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#10b981" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="strongGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="12"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="finGrid" width="30" height="30" patternUnits="userSpaceOnUse"><path fill="none" stroke="#38bdf8" stroke-opacity=".1" stroke-width=".5" d="M 30 0 L 0 0 0 30"/><circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity=".15"/></pattern><style>@keyframes pulseHub{0%{filter:drop-shadow(0 0 10px rgba(56,189,248,.5));opacity:.9}50%{filter:drop-shadow(0 0 22px rgba(16,185,129,.8));opacity:1}}@keyframes flowStroke{0%{stroke-dashoffset:240}}@keyframes sweepScan{0%{transform:translateY(0);opacity:.2}50%{opacity:.7}}@keyframes beaconExpand{0%{r:15px;opacity:.8;stroke-width:2px}}@keyframes floatCard1{0%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes floatCard2{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}.pulse-hub{animation:pulseHub 4s infinite ease-in-out}.stream-line{stroke-dasharray:12,12;animation:flowStroke 6s infinite linear}.fast-stream{stroke-dasharray:8,8;animation:flowStroke 3.5s infinite linear}.scanner-beam{animation:sweepScan 6s infinite linear}.pulse-beacon{animation:beaconExpand 3s infinite cubic-bezier(.1,.8,.3,1)}.float-badge-1{animation:floatCard1 4s infinite ease-in-out}.float-badge-2{animation:floatCard2 5s infinite ease-in-out 1s}.text-subtitle,.text-title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.text-title{font-weight:900;letter-spacing:.5px}.text-subtitle{font-weight:500}.text-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style></defs><rect width="900" height="240" fill="url(#bgGrad)" rx="16"/><rect width="900" height="240" fill="url(#finGrid)" rx="16"/><rect width="900" height="2" x="0" y="0" fill="url(#flowGrad)" class="scanner-beam" opacity=".6"/><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 120 120 L 210 120 L 250 65 L 380 65" class="stream-line"/><path fill="none" stroke="#10b981" stroke-width="1.5" d="M 120 120 L 190 175 L 340 175" class="stream-line"/><path fill="none" stroke="#38bdf8" stroke-width="1.2" d="M 760 60 L 690 60 L 660 100 L 590 100" class="fast-stream"/><path fill="none" stroke="#818cf8" stroke-width="1.2" d="M 820 180 L 730 180 L 700 145 L 630 145" class="fast-stream"/></g><g transform="translate(15, 0)"><circle cx="105" cy="120" r="20" fill="none" stroke="#38bdf8" class="pulse-beacon"/><circle cx="105" cy="120" r="75" fill="none" stroke="#38bdf8" stroke-dasharray="4 4" stroke-opacity=".15" stroke-width="1"/><circle cx="105" c